services:
  - type: web
    name: protrade-journal-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node server.js
    rootDir: protrade-journal
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: PORT
        value: 10000
